services:
  - type: web
    name: core50-object-recognition
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: "pip install -r requirements.txt && python scripts/restore_authoritative_mapping.py"
    startCommand: "python scripts/restore_authoritative_mapping.py && python app.py"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: GRADIO_SERVER_NAME
        value: 0.0.0.0
      - key: GRADIO_SERVER_PORT
        value: 10000
      - key: GRADIO_ANALYTICS_ENABLED
        value: "False"